# Kontinuierliche Prüfung.
#
# Der eigentliche Zweck dieser Datei steht in ADR-002: Die Validitätszusage
# des Produkts steht auf zwei Beinen. Die Laufzeitprüfung sieht Einheiten
# und Codes nicht — nur der Katalogtest gegen HAPI tut das. Fällt dieser
# Lauf weg, bricht die Zusage unbemerkt.
#
# Deshalb setzt dieser Workflow SYNTHFHIR_REQUIRE_HAPI=1. Damit wird ein
# nicht erreichbarer Server zum Fehlschlag statt zu einem stillen
# Übersprung, und die Auflage kann nicht versehentlich verfallen.
#
# Seit ADR-017 gilt dasselbe für den ZWEITEN Server, den mit den
# ISiK-Paketen. Er sichert die Zusage aus ADR-009 — die fünf Felder und
# den Kontakt zu jeder kodierten Diagnose. Was er ausdrücklich NICHT
# verspricht: dass SynthFHIR ISiK-konform ist. Das ist eine offene
# Produktfrage; hier wird nur verhindert, dass eine getroffene
# Entscheidung stillschweigend zurückgeht.
#
# Beide Server starten parallel. Gemessen am 2026-09-01: der einfache ist
# nach 53,2 s bereit, der mit den vier Paketen nach 57,3 s — der Aufschlag
# beträgt gut vier Sekunden, nicht die doppelte Wartezeit.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      hapi:
        image: hapiproject/hapi:v8.10.0-3
        ports:
          - 8080:8080
        env:
          hapi.fhir.fhir_version: R4
          hapi.fhir.allow_external_references: "true"
          hapi.fhir.enforce_referential_integrity_on_write: "false"

      # Der Profilserver. Inhaltsgleich mit
      # docs/belege/docker-compose.isik.yml — wer dort die Paketversionen
      # ändert, muss es hier auch tun, sonst misst die CI etwas anderes als
      # der Messaufbau.
      hapi-isik:
        image: hapiproject/hapi:v8.10.0-3
        ports:
          - 8090:8080
        env:
          hapi.fhir.fhir_version: R4
          hapi.fhir.allow_external_references: "true"
          hapi.fhir.enforce_referential_integrity_on_write: "false"
          hapi.fhir.implementationguides.isik.name: de.gematik.isik-basismodul
          hapi.fhir.implementationguides.isik.version: 4.0.3
          # Die Module für Observation und MedicationStatement (ADR-014).
          hapi.fhir.implementationguides.vital.name: de.gematik.isik-vitalparameter
          hapi.fhir.implementationguides.vital.version: 4.0.2
          hapi.fhir.implementationguides.medi.name: de.gematik.isik-medikation
          hapi.fhir.implementationguides.medi.version: 4.0.3
          hapi.fhir.implementationguides.basisprofil.name: de.basisprofil.r4
          hapi.fhir.implementationguides.basisprofil.version: 1.5.3

    env:
      # Ohne diese Variable würden die HAPI-Tests übersprungen statt zu
      # scheitern - siehe tests/conftest.py.
      SYNTHFHIR_REQUIRE_HAPI: "1"
      SYNTHFHIR_FHIR_BASE_URL: http://localhost:8080/fhir
      # Dasselbe für die Profilmessung, seit ADR-017. Ohne die Variable
      # liefe in der CI weder die Messung noch ihre Negativkontrolle.
      SYNTHFHIR_REQUIRE_PROFIL: "1"
      SYNTHFHIR_PROFIL_URL: http://localhost:8090/fhir

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -e ".[dev]"

      - name: Auf beide Server warten
        # Der Java-Server braucht nach dem Containerstart noch ein bis drei
        # Minuten, bis /metadata antwortet.
        #
        # Nacheinander gewartet, aber parallel gestartet: Wenn 8080
        # antwortet, hat 8090 dieselbe Zeit gehabt. Gemessen ist der
        # Unterschied gut vier Sekunden, das Paketladen fällt also kaum
        # ins Gewicht.
        run: |
          for port in 8080 8090; do
            bereit=""
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:$port/fhir/metadata" > /dev/null; then
                echo "Port $port bereit nach ca. $((i*5))s"
                bereit=ja
                break
              fi
              sleep 5
            done
            if [ -z "$bereit" ]; then
              echo "Port $port wurde nicht rechtzeitig bereit"
              exit 1
            fi
          done

      - name: Tests des Produkts
        run: python -m pytest tests -q

      - name: Tests des eingefrorenen Spikes
        # Der Spike ist Phase-0-Archiv, bleibt aber lauffähig: ADR-001 nennt
        # eine erneute Messreihe als Weg, die Architekturentscheidung zu
        # überprüfen. Ein kaputter Spike wäre als Revisionsweg wertlos.
        run: python -m pytest spike/tests -q
