# Ein ZWEITER HAPI, nur zum Messen: Wie weit ist die heutige Ausgabe von
# ISiK entfernt?
#
# Bewusst getrennt vom docker-compose.yml des Projekts und auf einem anderen
# Port. Der Messaufbau darf die Prüfkette der CI nicht anfassen, solange
# nicht entschieden ist, ob Profilkonformität überhaupt gebaut wird.
#
#   docker compose -f docker-compose.isik.yml up -d
services:
  hapi-isik:
    # Feste Fassung: Mit `:latest` misst der naechste Lauf gegen ein
    # anderes Werkzeug, ohne dass es im Bericht steht.
    image: hapiproject/hapi:v8.10.0-3
    container_name: synthfhir-hapi-isik
    ports:
      - "8090:8080"
    environment:
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.enforce_referential_integrity_on_write=false
      # Das vereinheitlichte ISiK-Paket der gematik (Stufe 5), FHIR R4.
      # Seit ADR-020 EIN Paket statt der drei eigenständigen Stufe-4-Module:
      # Es trägt Basismodul, Vitalparameter, Medikation UND Labor. Der
      # Labor-Teil ist hier korrekt (der `secondary-finding`-Defekt des
      # eigenständigen 4.0.0-rc ist in Stufe 5 behoben).
      - hapi.fhir.implementationguides.isik.name=de.gematik.isik
      - hapi.fhir.implementationguides.isik.version=5.1.3
      # 1.5.4, weil de.gematik.isik 5.1.3 genau diese Fassung als
      # Abhängigkeit deklariert. HAPI zieht die Abhängigkeiten selbst; eine
      # abweichende Pinnung (früher 1.5.3) lud zwei Fassungen von
      # de.basisprofil.r4 unter denselben kanonischen URLs und brach die
      # Profilauflösung.
      - hapi.fhir.implementationguides.basisprofil.name=de.basisprofil.r4
      - hapi.fhir.implementationguides.basisprofil.version=1.5.4
    restart: unless-stopped
